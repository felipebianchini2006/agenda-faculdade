services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda_faculdade
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda_faculdade"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ./bin/agenda-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT:-4000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4000}
      DATABASE_URL: ${DATABASE_URL:-postgres://agenda:agenda@postgres:5432/agenda_faculdade}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-felipebianchini02@gmail.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-me}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-me}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      ENABLE_TEST_AUTH: ${ENABLE_TEST_AUTH:-false}
      FAKE_GOOGLE_CALENDAR: ${FAKE_GOOGLE_CALENDAR:-false}
      SYNC_INLINE: ${SYNC_INLINE:-false}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ./bin/agenda-worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://agenda:agenda@postgres:5432/agenda_faculdade}
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-me}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-me}
      FAKE_GOOGLE_CALENDAR: ${FAKE_GOOGLE_CALENDAR:-false}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_TEST_AUTH: ${NEXT_PUBLIC_TEST_AUTH:-false}
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
